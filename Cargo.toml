[package]
name = "coin-toss"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hex = "0.4"
near-sdk = "=5.28.3"
num-bigint = { version = "0.4", default-features = false }

[dev-dependencies]
near-sdk = { version = "=5.28.3", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
overflow-checks = true
